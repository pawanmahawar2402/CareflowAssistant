# Render Blueprint, free tier: one web service. Redis (Upstash) and Qdrant (Qdrant Cloud) are external free services.
services:
  - type: web
    name: careflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free                # 512 MB, sleeps when idle; no payment information needed
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: REDIS_URL
        sync: false           # rediss://... from Upstash
      - key: QDRANT_URL
        sync: false           # https://<cluster>.cloud.qdrant.io:6333 from Qdrant Cloud
      - key: QDRANT_API_KEY
        sync: false
      - key: RAG_VARIANT
        value: hybrid         # no reranker: fits in 512 MB
      - key: CAREFLOW_DATA_DIR
        value: data
      - key: CAREFLOW_LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: CAREFLOW_FALLBACK_LLM_MODEL
        value: gemini/gemini-3.5-flash
      - key: CAREFLOW_EMBED_MODEL
        value: gemini/gemini-embedding-001
